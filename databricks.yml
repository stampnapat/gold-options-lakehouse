bundle:
  name: gold_options_lakehouse

# The parser ships to the pipeline as a wheel, so Spark workers can import it.
artifacts:
  cme_bulletin:
    type: whl
    build: uv build --wheel
    path: .

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog that holds every schema of this project
    default: gold_options_dev

targets:
  dev:
    # Not `mode: development`: that mode prefixes every schema with "dev_<user>_"
    # and pauses triggers. Each target already has its own catalog, and dev is
    # the environment the daily bulletins are uploaded to, so its file-arrival
    # trigger must stay live.
    default: true
    workspace:
      host: https://dbc-abd11c35-2b32.cloud.databricks.com
    variables:
      catalog: gold_options_dev

  prod:
    mode: production
    workspace:
      host: https://dbc-abd11c35-2b32.cloud.databricks.com
      root_path: /Workspace/Users/stampnapatt@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: gold_options_prod
