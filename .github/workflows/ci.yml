name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install package with dev tools
        run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - name: Ruff lint
        run: uv run --no-sync ruff check .
      - name: Ruff format check
        run: uv run --no-sync ruff format --check .
      # Tests use synthetic bulletins only: CME data never enters the repository.
      - name: Pytest
        run: uv run --no-sync pytest -v

  deploy:
    name: Validate and deploy bundle (dev)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-dev  # never two deploys at once
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      # Forks and fresh clones have no Databricks secrets: skip with a notice
      # instead of failing the whole run.
      - name: Check credentials
        id: creds
        run: |
          if [ -n "$DATABRICKS_HOST" ] && [ -n "$DATABRICKS_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DATABRICKS_HOST / DATABRICKS_TOKEN secrets not set; skipping deploy."
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ok == 'true'
      - uses: astral-sh/setup-uv@v10  # the bundle builds the parser wheel with uv
        if: steps.creds.outputs.ok == 'true'
      - uses: databricks/setup-cli@main
        if: steps.creds.outputs.ok == 'true'
      - name: Validate
        if: steps.creds.outputs.ok == 'true'
        run: databricks bundle validate -t dev
      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        run: databricks bundle deploy -t dev
