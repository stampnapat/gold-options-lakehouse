[project]
name = "gold-options-lakehouse"
version = "0.1.0"
description = "COMEX gold daily-expiry options lakehouse on Databricks"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff~=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
