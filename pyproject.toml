[project]
name = "gold-options-lakehouse"
version = "0.3.2"
description = "COMEX gold daily-expiry options lakehouse on Databricks"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber==0.11.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff~=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cme_bulletin", "src/options_math"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
