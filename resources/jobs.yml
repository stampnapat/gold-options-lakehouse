resources:
  jobs:
    gold_options_refresh:
      name: gold_options_refresh_${bundle.target}
      description: Refresh the pipeline whenever a new bulletin PDF lands in the volume.

      # Event-driven instead of a cron: bulletins are uploaded by hand at no fixed
      # time, so the job waits for the file rather than polling on a schedule.
      trigger:
        file_arrival:
          url: /Volumes/${var.catalog}/bronze/landing/section64/
          min_time_between_triggers_seconds: 60
        pause_status: UNPAUSED

      max_concurrent_runs: 1
      tasks:
        - task_key: refresh_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_options.id}

      email_notifications:
        on_failure:
          - stampnapatt@gmail.com
